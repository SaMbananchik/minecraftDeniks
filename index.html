<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Minecraft Economy | Облачная экономика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ МАЙН ЭКОНОМИКА</h1>
            <p>Данные синхронизируются в облаке</p>
        </header>

        <!-- Виджет входа (справа сверху) -->
        <div class="login-widget">
            <input type="password" id="passwordInputWidget" placeholder="Пароль">
            <button id="loginBtnWidget" class="btn-sm">Войти</button>
            <div id="accessBadge" class="access-badge">🔓 Режим просмотра</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="players">👥 Игроки</button>
            <button class="tab-btn" data-tab="rules">📜 Правила сервера</button>
        </div>

        <!-- Вкладка Игроки -->
        <div id="playersTab" class="tab-content active">
            <div class="cloud-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Проверка соединения...</span>
                <button id="manualSyncBtn" class="mini-btn">🔄 Синхронизировать</button>
            </div>
            <div class="toolbar">
                <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Поиск по нику..."></div>
                <div class="filter-box"><select id="estateFilter"><option value="all">Все сословия</option><option value="Крестьянин">🌾 Крестьянин</option><option value="Горожанин">🏠 Горожанин</option><option value="Элит Горожанин">✨ Элит Горожанин</option><option value="Дворянин">👑 Дворянин</option><option value="Высшая власть">⚡ Высшая власть</option></select></div>
                <div class="sort-box"><select id="sortSelect"><option value="name">По имени (А-Я)</option><option value="name-desc">По имени (Я-А)</option><option value="diamonds">По алмазам (↓)</option><option value="diamonds-asc">По алмазам (↑)</option><option value="estate">По сословию</option></select></div>
                <button id="createBtn" class="btn-primary">➕ Создать игрока</button>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-info"><div class="stat-label">Игроков</div><div class="stat-value" id="totalPlayers">0</div></div></div>
                <div class="stat-card"><div class="stat-icon">💎</div><div class="stat-info"><div class="stat-label">Всего алмазов</div><div class="stat-value" id="totalDiamonds">0</div></div></div>
                <div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-info"><div class="stat-label">Богатейший</div><div class="stat-value" id="richestPlayer">-</div></div></div>
            </div>
            <div class="table-container">
                <table id="playersTable"><thead><tr><th>#</th><th>Игрок</th><th>Сословие</th><th>💎 Алмазы</th><th>📜 Лицензии</th><th>⚙️ Действия</th></tr></thead><tbody id="tableBody"><tr><td colspan="6" class="loading">Загрузка данных...</td></tr></tbody></table>
            </div>
        </div>

        <!-- Вкладка Правила -->
        <div id="rulesTab" class="tab-content">
            <div class="rules-header">
                <div id="rulesTabsContainer" class="rules-tabs"></div>
                <div id="rulesEditTools" style="display: none;"><button id="addRuleTabBtn" class="btn-sm">➕ Добавить вкладку</button></div>
            </div>
            <div id="rulesContentArea" class="rules-content-area"></div>
        </div>
    </div>

    <!-- Модалки -->
    <div id="playerModal" class="modal"><div class="modal-content"><div class="modal-header"><h2 id="modalTitle">Создать игрока</h2><button class="close-modal" onclick="closeModal()">✕</button></div><div class="modal-body"><input type="hidden" id="editNick"><div class="form-group"><label>👤 Ник</label><input type="text" id="playerNick"></div><div class="form-group"><label>📜 Сословие</label><select id="playerEstate"><option>Крестьянин</option><option>Горожанин</option><option>Элит Горожанин</option><option>Дворянин</option><option>Высшая власть</option></select></div><div class="form-group"><label>💎 Алмазы</label><input type="number" id="playerDiamonds" value="0"></div><div class="form-group"><label>📜 Лицензии (через пробел)</label><input type="text" id="playerLicenses"></div></div><div class="modal-footer"><button class="btn-secondary" onclick="closeModal()">Отмена</button><button class="btn-primary" id="saveBtn">Сохранить</button></div></div></div>
    <div id="diamondModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>💎 Управление алмазами</h2><button class="close-modal" onclick="closeDiamondModal()">✕</button></div><div class="modal-body"><p><strong>Игрок:</strong> <span id="diamondPlayerName"></span></p><div class="diamond-controls"><div class="control-group"><label>➕ Добавить</label><div class="input-group"><input type="number" id="addDiamonds" value="0"><button class="btn-sm" onclick="addDiamonds()">Добавить</button></div></div><div class="control-group"><label>➖ Убрать</label><div class="input-group"><input type="number" id="removeDiamonds" value="0"><button class="btn-sm" onclick="removeDiamonds()">Убрать</button></div></div><div class="control-group"><label>✏️ Установить</label><div class="input-group"><input type="number" id="setDiamonds" value="0"><button class="btn-sm" onclick="setDiamonds()">Установить</button></div></div></div></div></div></div>
    <div id="editRuleTabModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>Редактировать вкладку</h2><button class="close-modal" onclick="closeEditTabModal()">✕</button></div><div class="modal-body"><div class="form-group"><label>Название</label><input type="text" id="editTabName"></div><div class="form-group"><label>Содержимое</label><textarea id="editTabContent" rows="8"></textarea></div></div><div class="modal-footer"><button class="btn-secondary" onclick="closeEditTabModal()">Отмена</button><button class="btn-primary" id="saveTabBtn">Сохранить</button></div></div></div>

    <div id="toast" class="toast"></div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
