<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Minecraft Economy | Live Realtime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>⛏️ Minecraft Economy 🌐 Live</h1>
    <div class="sub" id="cloudStatus">📡 Подключение к живому серверу базы данных...</div>

    <div class="password-bar">
        <span>🔒</span>
        <input type="password" id="passwordInput" placeholder="Введите пароль для доступа...">
        <button id="loginBtn">Войти</button>
        <span id="accessStatus" class="access-status access-none">🔴 Только просмотр</span>
    </div>

    <div class="toolbar">
        <input type="text" id="search" placeholder="🔍 Поиск по нику..." style="flex:2">
        <select id="estateFilter">
            <option value="all">Все сословия</option>
            <option value="Младший Крестьянин">🌾 Младший Крестьянин</option>
            <option value="Крестьянин">🌿 Крестьянин</option>
            <option value="Средний класс">🏠 Средний класс</option>
            <option value="Дворянин">👑 Дворянин</option>
            <option value="Высшая власть">⚡ Высшая власть</option>
        </select>
        <select id="sortBy">
            <option value="name">По имени (А-Я)</option>
            <option value="name-desc">По имени (Я-А)</option>
            <option value="diamonds">По алмазам (↓)</option>
            <option value="diamonds-asc">По алмазам (↑)</option>
            <option value="estate">По сословию</option>
        </select>
        <button id="createBtn">➕ Создать</button>
        <button id="refreshBtn">🔄 Сбросить базу (тест)</button>
    </div>

    <div class="stats">
        <div class="stat">👥 Игроков: <span id="totalPlayers">0</span></div>
        <div class="stat">💎 Всего алмазов: <span id="totalDiamonds">0</span></div>
        <div class="stat">🏆 Богатейший: <span id="richestPlayer">-</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Ник</th>
                    <th>Сословие</th>
                    <th>💎 Алмазы</th>
                    <th>📜 Лицензии</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" class="loading">Загрузка данных из облака...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Создать игрока</h2>
            <button class="close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>👤 Ник</label>
                <input type="text" id="nick" placeholder="Ник игрока">
            </div>
            <div class="form-group">
                <label>📜 Сословие</label>
                <select id="estate">
                    <option>Младший Крестьянин</option>
                    <option>Крестьянин</option>
                    <option>Средний класс</option>
                    <option>Дворянин</option>
                    <option>Высшая власть</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>💎 Текущие Алмазы</label>
                <input type="number" id="diamonds" value="0">
                
                <div id="diamondsActionBlock" class="diamonds-actions-block">
                    <button type="button" class="btn-action-dim decrease" id="btnDecreaseDim">Убрать</button>
                    <input type="number" id="dimChangeAmount" value="100" min="1">
                    <button type="button" class="btn-action-dim increase" id="btnIncreaseDim">Добавить</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>📜 Лицензии (через пробел)</label>
                <input type="text" id="licenses" placeholder="Шахтёрская Строительная">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" id="cancelModalBtn">Отмена</button>
            <button class="btn-save" id="saveBtn">Сохранить</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
